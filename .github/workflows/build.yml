name: Build OpenWrt binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: "false"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test -mod=readonly ./...

      - name: Run vet
        run: go vet ./...

  build:
    name: Build linux/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            binary: sv-linux-amd64
          - goarch: arm64
            binary: sv-linux-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -trimpath \
            -tags "netgo osusergo" \
            -ldflags "-s -w" \
            -o "dist/${{ matrix.binary }}" \
            .
          file "dist/${{ matrix.binary }}"
          file "dist/${{ matrix.binary }}" | grep -F "statically linked"
          sha256sum "dist/${{ matrix.binary }}" > "dist/${{ matrix.binary }}.sha256"
          tar -C dist -czf "dist/${{ matrix.binary }}.tar.gz" "${{ matrix.binary }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.tar.gz
            dist/${{ matrix.binary }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/amd64 release-assets/arm64
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name sv-linux-amd64 \
            --dir release-assets/amd64
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name sv-linux-arm64 \
            --dir release-assets/arm64

      - name: Prepare binary assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release-assets/amd64/sv-linux-amd64 dist/sv-linux-amd64
          cp release-assets/arm64/sv-linux-arm64 dist/sv-linux-arm64
          chmod 0755 dist/sv-linux-amd64 dist/sv-linux-arm64
          file dist/sv-linux-amd64 dist/sv-linux-arm64
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Static Linux binaries for OpenWrt-compatible amd64 and arm64 targets." \
            --latest \
            --verify-tag \
            dist/sv-linux-amd64 \
            dist/sv-linux-arm64
